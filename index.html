<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive mind map of Garmin exercises">
  <title>Garmin Exercises</title>
  <style>
  :root {
    color-scheme:light;
    --ink:#243744;
    --muted:#71838c;
    --line:#dce6e9;
    --paper:#f5f8f8;
    --blue:#079fda;
  }
  * {
    box-sizing:border-box;
  }
  html,body {
    height:100%;
    margin:0;
  }
  body {
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .map-wrap {
    position:relative;
    height:100%;
    overflow:hidden;
    background-color:#f7fafb;
    background-image:radial-gradient(#dce5e8 1px,transparent 1px);
    background-size:22px 22px;
  }
  .floating-tools {
    position:absolute;
    top:14px;
    left:14px;
    z-index:3;
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .search-tools {
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .search {
    position:relative;
    width:230px;
  }
  .search:before {
    content:"⌕";
    position:absolute;
    left:10px;
    top:1px;
    color:#7b9099;
    font-size:21px;
    pointer-events:none;
  }
  .search input {
    width:100%;
    height:34px;
    padding:0 10px 0 32px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#ffffffed;
    color:var(--ink);
    font:inherit;
    font-size:12px;
    outline:none;
    box-shadow:0 3px 12px #1435450b;
  }
  .search input:focus {
    border-color:#62bed6;
    box-shadow:0 0 0 3px #079fda16;
  }
  .suggestions {
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    right:0;
    z-index:6;
    display:none;
    max-height:220px;
    overflow:auto;
    padding:4px;
    border:1px solid #dce6e9;
    border-radius:9px;
    background:#fff;
    box-shadow:0 8px 20px #1435451a;
  }
  .suggestions.show {
    display:block;
  }
  .suggestions button {
    display:block;
    width:100%;
    padding:6px 8px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#354b57;
    font:inherit;
    font-size:12px;
    text-align:left;
    cursor:pointer;
  }
  .suggestions button:hover,.suggestions button:focus {
    outline:none;
    background:#eaf6f8;
    color:#087f9f;
  }
  .actions {
    display:flex;
    gap:6px;
  }
  .actions button {
    display:grid;
    place-items:center;
    width:38px;
    height:38px;
    padding:0;
    border:1px solid var(--line);
    border-radius:10px;
    background:#ffffffed;
    color:#425563;
    cursor:pointer;
    box-shadow:0 3px 12px #1435450b;
  }
  .actions button:disabled {
    opacity:.42;
    cursor:not-allowed;
    box-shadow:none;
  }
  .actions button svg {
    width:19px;
    height:19px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .actions button:hover {
    border-color:#8ccbdc;
    color:#0573aa;
  }
  .actions button[aria-pressed="true"] {
    background:#fff3c4;
    border-color:#e3b228;
    color:#a77900;
  }
  .actions #search-toggle {
    display:none;
  }
  #map {
    width:100%;
    height:100%;
    outline:none;
  }
  .foot {
    position:absolute;
    left:15px;
    bottom:13px;
    z-index:2;
    padding:8px 11px;
    border:1px solid #dce6e8;
    border-radius:10px;
    background:#ffffffed;
    color:#687b85;
    font-size:11px;
    box-shadow:0 3px 12px #1435450b;
    pointer-events:none;
  }
  .foot a {
    color:#087f9f;
    text-decoration:none;
    font-weight:700;
    pointer-events:auto;
  }
  .card-legend {
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-right:9px;
    white-space:nowrap;
  }
  .card-legend i {
    display:inline-block;
    width:9px;
    height:9px;
    border:1px solid;
    border-radius:50%;
  }
  .card-legend .green {
    background:#e3f2e5;
    border-color:#78b982;
  }
  .card-legend .yellow {
    background:#fff2c4;
    border-color:#d8b646;
  }
  .card-legend .gray {
    background:#e9edef;
    border-color:#a8b1b6;
  }
  .result {
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    padding:7px 12px;
    border:1px solid #b9dfe8;
    border-radius:999px;
    background:#fff;
    color:#126a83;
    font-size:12px;
    font-weight:700;
    box-shadow:0 3px 12px #14354510;
    pointer-events:none;
  }
  .result.show {
    display:block;
  }
  .info {
    position:absolute;
    top:14px;
    right:16px;
    z-index:2;
    display:none;
    max-width:320px;
    padding:12px 14px;
    border:1px solid #dce6e8;
    border-radius:12px;
    background:#fffffff2;
    box-shadow:0 6px 22px #14354512;
  }
  .info.show {
    display:block;
  }
  .info-heading {
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-bottom:5px;
  }
  .info-heading strong {
    flex:1;
    font-size:14px;
    line-height:1.3;
  }
  .copy-name {
    display:grid;
    place-items:center;
    flex:0 0 28px;
    width:28px;
    height:28px;
    margin:-4px -5px 0 0;
    padding:0;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#647984;
    cursor:pointer;
  }
  .copy-name:hover {
    background:#eaf4f6;
    color:#0573aa;
  }
  .copy-name svg {
    width:16px;
    height:16px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .info small {
    display:block;
    color:var(--muted);
  }
  .info a {
    display:inline-block;
    margin-top:7px;
    color:#0573aa;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
  }
  .info small a.muscle-search,.info small a.equipment-search {
    display:inline;
    margin:0;
    font-size:inherit;
    font-weight:400;
    text-decoration:underline;
    cursor:pointer;
  }
  .source-links {
    display:flex;
    flex-wrap:wrap;
    gap:4px 10px;
    margin-top:4px;
  }
  .source-links a {
    margin:0;
    font-size:11px;
  }
  .info-muscle-map {
    display:block;
    width:176px;
    max-width:100%;
    height:110px;
    object-fit:contain;
    margin:5px auto 8px;
  }
  @media(max-width:520px) {
    .floating-tools {
      top:8px;
      left:8px;
      right:8px;
      gap:8px;
      align-items:flex-start;
    }
    .search-tools {
      display:none;
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      right:0;
      flex-direction:column;
      gap:4px;
      padding:8px;
      border:1px solid #dce6e9;
      border-radius:12px;
      background:#fffffff2;
      box-shadow:0 8px 24px #14354518;
      z-index:4;
    }
    .floating-tools.search-open .search-tools {
      display:flex;
    }
    .search {
      width:100%;
      min-width:0;
    }
    .search input {
      height:32px;
      padding-left:30px;
      font-size:12px;
    }
    .actions {
      flex:0 0 auto;
      flex-direction:row;
      gap:4px;
    }
    .actions button {
      width:34px;
      height:34px;
    }
    .actions #search-toggle {
      display:grid;
    }
    .result {
      top:116px;
      left:auto;
      right:8px;
      transform:none;
      max-width:calc(100vw - 16px);
      padding:5px 9px;
    }
    .info {
      top:auto;
      left:8px;
      right:8px;
      bottom:calc(8px + env(safe-area-inset-bottom));
      max-width:none;
      max-height:40vh;
      overflow-y:auto;
      overscroll-behavior:contain;
      padding:11px 12px;
    }
    .info.show~.foot {
      display:none;
    }
    .foot {
      left:8px;
      right:8px;
      bottom:calc(8px + env(safe-area-inset-bottom));
      max-width:calc(100vw - 16px);
      font-size:10px;
    }
  }
  </style>
</head>
<body>
  <main class="map-wrap">
    <div class="floating-tools">
      <div class="search-tools" id="search-tools">
        <label class="search"><input id="search-name" type="search" placeholder="Name" autocomplete="off" aria-label="Filter by exercise name"></label>
        <div class="search"><input id="search-equipment" type="search" placeholder="Equipment" autocomplete="off" aria-label="Filter by equipment" aria-controls="equipment-suggestions" aria-expanded="false"><div class="suggestions" id="equipment-suggestions" role="listbox" aria-label="Equipment suggestions"></div></div>
        <div class="search"><input id="search-muscles" type="search" placeholder="Muscles" autocomplete="off" aria-label="Filter by muscle group" aria-controls="muscle-suggestions" aria-expanded="false"><div class="suggestions" id="muscle-suggestions" role="listbox" aria-label="Muscle suggestions"></div></div>
      </div>
      <div class="actions">
        <button id="search-toggle" type="button" title="Search" aria-label="Show search fields" aria-expanded="false" aria-controls="search-tools"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
        <button id="favorites-filter" aria-label="Show favorites" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"></path></svg></button>
        <button id="images-filter" type="button" title="Show exercises with Garmin images" aria-label="Show exercises with Garmin images" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8" cy="9" r="1.5"></circle><path d="m4 18 6-6 4 4 3-3 3 5"></path></svg></button>
        <button id="collapse" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12h8"></path></svg></button>
        <button id="fit" title="Fit all" aria-label="Fit all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path></svg></button>
      </div>
    </div>
    <div id="map" aria-label="Garmin exercise mind map"></div>
    <div class="result" id="result"></div>
    <aside class="info" id="info"></aside>
    <div class="foot">
      Click a node to expand · Scroll to zoom · Drag to pan<br>
      <span class="card-legend"><i class="green"></i>Garmin link</span>
      <span class="card-legend"><i class="yellow"></i>External link</span>
      <span class="card-legend"><i class="gray"></i>No links</span><br>
      <span class="copyright">
        Thanks to
        <a href="https://github.com/maximecharriere/GarminExercisesCollector" target="_blank" rel="noreferrer">
          GarminExercisesCollector
        </a>
      </span>
    </div>
  </main>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="./exercises-data.js"></script>
  <script src="./muscle-map-template.js"></script>
  <script>
    const exercises = window.GARMIN_EXERCISES;
    const muscleSvgTemplate = window.GARMIN_MUSCLE_SVG;
    const muscleImageCache = new Map();
    const palette = [
      '#087f9f',
      '#168f84',
      '#4688b8',
      '#62864a',
      '#7c71b7',
      '#bd7750',
      '#a95678',
      '#5d8293'
    ];
    const groups = new Map();
    for (const item of exercises){
      if (!item.name || !item.category)continue;
      if (!groups.has(item.category))groups.set(item.category,[]);
      groups.get(item.category).push(item)
    }
    function buildTree(items){
      const nodes = items.map((item, i) => ({
        ... item, id: `exercise-${item.category}-${i}`, type: 'exercise', children:[]
      }));
      for (const node of nodes){
        const name = node.name.toLocaleLowerCase();
        const candidates = nodes.filter(other =>{
          const base = other.name.toLocaleLowerCase();
          if (base === name || base.length >= name.length)return false;
          const phrase = base.split(/\s+/).map(part => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+');
          return new RegExp(`(^|[^\\p{L}\\p{N}])${phrase}($|[^\\p{L}\\p{N}])`, 'u').test(name)
        }).sort((a, b) => b.name.length - a.name.length);
        if (candidates.length)node.parent = candidates[0]
      }
      for (const node of nodes)if (node.parent)node.parent.children.push(node);
      return nodes.filter(node => !node.parent)
    }
    const categories =[... groups.keys()].sort((a, b) => a.localeCompare(b, 'en')).map((name, i) => ({
      id: `category-${i}`, name, category: name, color: palette[i % palette.length], children: buildTree(groups.get(name)), open: false, type: 'category'
    }));
    function collectCategoryMuscles(category){
      const primary = new Set(),
      secondary = new Set(),
      equipment = new Set();
      function visit(node){
        (node.primaryMuscles ||[]).forEach(muscle => primary.add(muscle));
        (node.secondaryMuscles ||[]).forEach(muscle => secondary.add(muscle));
        (node.equipment ||[]).forEach(item => equipment.add(item));
        (node.children ||[]).forEach(visit)
      }
      visit(category);
      category.primaryMuscles =[... primary];
      category.secondaryMuscles =[... secondary].filter(muscle => !primary.has(muscle));
      category.equipment =[... equipment]
    }
    categories.forEach(collectCategoryMuscles);
    const root ={
      id: 'root',
      name: 'Garmin Exercises',
      children: categories,
      open: false,
      type: 'root'
    };
    const muscleAliases ={
      ABS: 'abdominal abdominals core',
      OBLIQUES: 'oblique obliques',
      LOWER_BACK: 'lower back erector spinae',
      HIPS: 'hip hips hip flexor hip flexors',
      QUADS: 'quadriceps quadricep',
      CHEST: 'pectorals pectoral pecs',
      SHOULDERS: 'deltoids deltoid',
      BICEPS: 'biceps',
      FOREARM: 'forearm forearms',
      CALVES: 'calf calves',
      HAMSTRINGS: 'hamstring hamstrings',
      GLUTES: 'glute glutes gluteus gluteal',
      ADDUCTORS: 'adductor adductors inner thigh',
      ABDUCTORS: 'abductor abductors outer thigh',
      LATS: 'lat latissimus latissimus dorsi',
      TRAPS: 'trap traps trapezius',
      TRICEPS: 'tricep triceps'
    };
    function prepareSearchText(node){
      const groups =[... (node.primaryMuscles ||[]),
      ... (node.secondaryMuscles ||[])],
      muscleTerms = groups.flatMap(group =>[group, group.replace(/_/g, ' '), muscleAliases[group] || '']);
      node.nameSearchText =[node.name,
      node.garminId || ''].join(' ').toLocaleLowerCase();
      node.equipmentSearchText = (node.equipment ||[]).join(' ').toLocaleLowerCase();
      node.muscleSearchText = muscleTerms.join(' ').toLocaleLowerCase();
      (node.children ||[]).forEach(prepareSearchText)
    }
    prepareSearchText(root);
    const touchOptimized = window.matchMedia('(pointer: coarse)').matches;
    const mapEl = document.getElementById('map'), nodeSet = new vis.DataSet(), edgeSet = new vis.DataSet();
    const network = new vis.Network(mapEl,{
      nodes: nodeSet, edges: edgeSet
    },{
      autoResize: true, physics:{
        enabled: false
      }, layout:{
        improvedLayout: false
      }, interaction:{
        dragNodes: false, dragView: true, zoomView: true, hideNodesOnDrag: false, hideEdgesOnDrag: touchOptimized, hideEdgesOnZoom: touchOptimized, hover: true, selectable: true, multiselect: false, keyboard:{
          enabled: false
        }
      }, nodes:{
        shape: 'box', shapeProperties:{
          borderRadius: 12
        }, margin:{
          top: 8, right: 11, bottom: 8, left: 11
        }, widthConstraint:{
          maximum: 220
        }, font:{
          face: 'Inter, system-ui, sans-serif', size: 13, color: '#263945', align: 'center', multi: false
        }, borderWidth: 1.5, shadow: false
      }, edges:{
        smooth:{
          enabled: true, type: 'cubicBezier', forceDirection: 'horizontal', roundness: .42
        }, selectionWidth: 0, hoverWidth: 0
      }
    });
    const categoryFor = node => node.type === 'category' ? node: categories.find(c => node.category === c.name);
    function wrapLabel(text, max = 25){
      const words = text.replace(/_/g, ' ').split(/\s+/),
      lines =[];
      let line = '';
      for (const word of words){
        const next = line ? line + ' ' + word: word;
        if (next.length > max && line){
          lines.push(line);
          line = word
        }
        else line = next
      }
      if (line)lines.push(line);
      return lines
    }
    const showMuscleMaps = true;
    const cardWidth = 260, imageBandHeight = 136, textLineHeight = 15, categoryCardWidth = 220, categoryImageBandHeight = 90, categoryPhotoBandHeight = 110, rootCardWidth = 180, rootCardHeight = 64;
    let redrawQueued = false;
    function scheduleNetworkRedraw(){
      if (redrawQueued)return;
      redrawQueued = true;
      requestAnimationFrame(() =>{
        redrawQueued = false;
        network.redraw()
      })
    }
    function hasMuscleTargets(node){
      return Boolean((node.primaryMuscles && node.primaryMuscles.length) || (node.secondaryMuscles && node.secondaryMuscles.length))
    }
    const muscleGroupByGarminPath ={
      FrontQuads: 'QUADS',
      FrontHips: 'HIPS',
      FrontAbs: 'ABS',
      FrontObliques: 'OBLIQUES',
      FrontChest: 'CHEST',
      FrontShoulders: 'SHOULDERS',
      FrontBiceps: 'BICEPS',
      FrontForearms: 'FOREARM',
      BackCalves: 'CALVES',
      BackHamstrings: 'HAMSTRINGS',
      BackGlutes: 'GLUTES',
      BackAdductors: 'ADDUCTORS',
      BackAbductors: 'ABDUCTORS',
      BackLowerBack: 'LOWER_BACK',
      BackLats: 'LATS',
      BackTraps: 'TRAPS',
      BackShoulders: 'SHOULDERS',
      BackForearms: 'FOREARM',
      BackTriceps: 'TRICEPS',
      BackNeck: 'NECK'
    };
    function muscleMapSvgFor(node, includeEmpty = false){
      if (!showMuscleMaps || (!includeEmpty && !hasMuscleTargets(node)))return null;
      const primary = new Set(node.primaryMuscles ||[]),
      secondary = new Set(node.secondaryMuscles ||[]);
      let svg = muscleSvgTemplate;
      for (const[garminPath, group] of Object.entries(muscleGroupByGarminPath)){
        const state = primary.has(group) ? 'primary': secondary.has(group) ? 'secondary': null;
        if (!state)continue;
        const pathPrefix = 'class="' + garminPath;
        const expression = new RegExp('(<path\\b[^>]*' + pathPrefix + '[^>]*data-muscle-group="' + group + '")', 'g');
        svg = svg.replace(expression, '$1 data-target="' + state + '"');
      }
      return svg
    }
    function muscleMapImageFor(node, includeEmpty = false){
      if (!showMuscleMaps || (!includeEmpty && !hasMuscleTargets(node)))return null;
      const key = JSON.stringify([... (node.primaryMuscles ||[])].sort()) + '|' + JSON.stringify([... (node.secondaryMuscles ||[])].sort());
      let img = muscleImageCache.get(key);
      if (img)return img;
      const svg = muscleMapSvgFor(node, includeEmpty);
      if (!svg)return null;
      img = new Image();
      muscleImageCache.set(key, img);
      const svgUrl = URL.createObjectURL(new Blob([svg],{
        type: 'image/svg+xml'
      }));
      img.onload = () =>{
        URL.revokeObjectURL(svgUrl);
        scheduleNetworkRedraw()
      };
      img.onerror = () =>{
        URL.revokeObjectURL(svgUrl);
        scheduleNetworkRedraw()
      };
      img.src = svgUrl;
      return img
    }
    function muscleMapDataUrlFor(node){
      const svg = muscleMapSvgFor(node, node.type !== 'root');
      return svg ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg): ''
    }
    const favoriteStorageKey = 'garmin-exercises-favorites';
    let favoriteIds = new Set();
    try{
      favoriteIds = new Set(JSON.parse(localStorage.getItem(favoriteStorageKey) || '[]'))
    }
    catch{}
    let favoritesOnly = false, imagesOnly = false;
    function favoriteKey(node){
      return node.garminId
    }
    function isFavorite(node){
      return favoriteIds.has(favoriteKey(node))
    }
    function saveFavorites(){
      try{
        localStorage.setItem(favoriteStorageKey, JSON.stringify([... favoriteIds]))
      }
      catch{}
    }
    function syncFavoritesFilter(){
      const button = document.getElementById('favorites-filter');
      button.setAttribute('aria-pressed', String(favoritesOnly));
      button.title = favoritesOnly ? 'Show all exercises': 'Show favorites';
      button.setAttribute('aria-label', button.title)
    }
    function syncImagesFilter(){
      const button = document.getElementById('images-filter');
      button.setAttribute('aria-pressed', String(imagesOnly));
      button.title = imagesOnly ? 'Show all exercises': 'Show exercises with Garmin images';
      button.setAttribute('aria-label', button.title)
    }
    let activeSearches ={
      name: '',
      equipment: '',
      muscles: ''
    };
    const searchMatchCache = new Map(), visibleChildrenCache = new Map();
    function hasActiveSearch(){
      return favoritesOnly || imagesOnly || Boolean(activeSearches.name || activeSearches.equipment || activeSearches.muscles)
    }
    function matchesSearch(node){
      if ((favoritesOnly || imagesOnly) && node.type !== 'exercise')return false;
      if (favoritesOnly && !isFavorite(node))return false;
      if (imagesOnly && !exerciseCardImage(node).url)return false;
      return (!activeSearches.name || (node.nameSearchText || '').includes(activeSearches.name)) && (!activeSearches.equipment || (node.equipmentSearchText || '').includes(activeSearches.equipment)) && (!activeSearches.muscles || (node.muscleSearchText || '').includes(activeSearches.muscles))
    }
    function hasMatchingDescendant(node){
      if (searchMatchCache.has(node.id))return searchMatchCache.get(node.id);
      const found = (node.children ||[]).some(child => matchesSearch(child) || hasMatchingDescendant(child));

        ctxRenderer: node.type === 'exercise' ? exerciseCardRenderer(node, branchColor): node.type === 'category' ? categoryCardRenderer(node): rootCardRenderer(node)
      };
      return base
    }
    let activeVisibleNodeRecords =[];
    function draw(keepView = true){
      layoutSpanCache.clear();
      const{
        nodes,
        edges,
        records
      }
      = visibleGraph();
      activeVisibleNodeRecords = records;
      nodeSet.clear();
      edgeSet.clear();
      nodeSet.add(nodes);
      edgeSet.add(edges);
      if (!keepView)network.fit({
        animation: false, minZoomLevel: .42, maxZoomLevel: .9
      })
    }
    draw(false);
    function exerciseHitAt(point){
      if (!point)return null;
      for (let i = activeVisibleNodeRecords.length - 1;
      i >= 0;
      i--){
        const record = activeVisibleNodeRecords[i];
        if (record.node.type !== 'exercise')continue;
        if (Math.abs(point.x - record.x) <= record.width / 2 + 15 && Math.abs(point.y - record.y) <= record.height / 2 + 15)return record.node.id
      }
      return null
    }
    function favoriteHitAt(point){
      if (!point)return null;
      for (let i = activeVisibleNodeRecords.length - 1;
      i >= 0;
      i--){
        const record = activeVisibleNodeRecords[i];
        if (record.node.type !== 'exercise')continue;
        const x = record.x + record.width / 2 - 17,
        y = record.y - record.height / 2 + 17;
        if (Math.abs(point.x - x) <= 13 && Math.abs(point.y - y) <= 13)return record.node.id
      }
      return null
    }
    function categoryHitAt(point){
      if (!point)return null;
      for (let i = activeVisibleNodeRecords.length - 1;
      i >= 0;
      i--){
        const record = activeVisibleNodeRecords[i];
        if (record.node.type !== 'category')continue;
        if (Math.abs(point.x - record.x) <= record.width / 2 + 15 && Math.abs(point.y - record.y) <= record.height / 2 + 15)return record.node.id
      }
      return null
    }
    function rootHitAt(point){
      if (!point)return null;
      return Math.abs(point.x) <= rootCardWidth / 2 + 15 && Math.abs(point.y) <= rootCardHeight / 2 + 15 ? 'root': null
    }
    network.on('click', params =>{
      const favoriteId = favoriteHitAt(params.pointer?.canvas);
      if (favoriteId){
        const favoriteNode = findNode(root, favoriteId), key = favoriteKey(favoriteNode);
        favoriteIds.has(key) ? favoriteIds.delete(key): favoriteIds.add(key);
        saveFavorites();
        searchMatchCache.clear();
        visibleChildrenCache.clear();
        if (favoritesOnly)applySearch();
        else draw(true);
        return
      }
      const id = exerciseHitAt(params.pointer?.canvas) || categoryHitAt(params.pointer?.canvas) || rootHitAt(params.pointer?.canvas) || params.nodes[0];
      if (!id){
        document.getElementById('info').classList.remove('show');
        highlightedNodeId = null;
        scheduleNetworkRedraw();
        return
      }
      const node = id === 'root' ? root: categories.find(c => c.id === id) || findNode(root, id);
      if (!node)return;
      const alreadyHighlighted = highlightedNodeId === node.id;
      if (node.id === 'root'){
        categories.forEach(c => setAll(c, false));
        draw(true)
      }
      else if (node.children?.length){
        if (!node.open){
          node.open = true;
          draw(true)
        }
        else if (alreadyHighlighted){
          node.open = false;
          draw(true)
        }
      }
      showInfo(node)
    });
    mapEl.addEventListener('pointermove', event =>{
      if (event.pointerType === 'touch'){
        mapEl.style.cursor = 'grab';
        return
      }
      const rect = mapEl.getBoundingClientRect(), dom ={
        x: event.clientX - rect.left, y: event.clientY - rect.top
      }, canvas = network.DOMtoCanvas(dom), exerciseId = exerciseHitAt(canvas), nodeId = exerciseId || categoryHitAt(canvas) || rootHitAt(canvas) || network.getNodeAt(dom) || null;
      if (exerciseId !== pointerHoveredExerciseId){
        pointerHoveredExerciseId = exerciseId;
        scheduleNetworkRedraw()
      }
      mapEl.style.cursor = nodeId ? 'pointer': 'grab'
    });
    mapEl.addEventListener('pointerleave', () =>{
      if (pointerHoveredExerciseId){
        pointerHoveredExerciseId = null;
        scheduleNetworkRedraw()
      }
      mapEl.style.cursor = 'grab'
    });
    function findNode(node, id){
      for (const child of node.children ||[]){
        if (child.id === id)return child;
        const found = findNode(child, id);
        if (found)return found
      }
      return null
    }
    function showInfo(node){
      highlightedNodeId = node.id;
      scheduleNetworkRedraw();
      const info = document.getElementById('info'),
      parts =[],
      links =[],
      seen = new Set();
      const addSource = (label, url) =>{
        if (!url || seen.has(url))return;
        seen.add(url);
        links.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(label)} ↗</a>`)
      };
      if (node.difficulty)parts.push(`<small>Difficulty: ${escapeHtml(node.difficulty)}</small>`);
      const muscleMap = muscleMapDataUrlFor(node);
      if (muscleMap)parts.push(`<img class="info-muscle-map" src="${muscleMap}" alt="Muscle map for ${escapeHtml(node.name)}">`);
      if (node.equipment?.length){
        const equipmentLinks = node.equipment.map(item => `<a href="#search-equipment" class="equipment-search" data-equipment="${escapeHtml(item)}">${escapeHtml(item.toLowerCase())}</a>`).join(', ');
        parts.push(`<small>Equipment: ${equipmentLinks}</small>`)
      }
      if (hasMuscleTargets(node)){
        const muscleLinks = list => (list ||[]).filter(Boolean).map(m => `<a href="#search" class="muscle-search" data-muscle="${escapeHtml(m)}">${escapeHtml(m.replace(/_/g,' ').toLowerCase())}</a>`).join(', ');
        const primaryLinks = muscleLinks(node.primaryMuscles);
        if (primaryLinks)parts.push(`<small>Primary muscles: ${primaryLinks}</small>`);
        const secondaryLinks = muscleLinks(node.secondaryMuscles);
        if (secondaryLinks)parts.push(`<small>Secondary muscles: ${secondaryLinks}</small>`);
      }
      if (node.type === 'exercise'){
        if (node.url)addSource('Garmin Connect', node.url);
        (node.externalSources ||[]).forEach(source => addSource(source.source, source.url));
        if (links.length)parts.push(`<div class="source-links">${links.join('')}</div>`);
      }
      info.innerHTML = `
        <div class="info-heading">
          <strong>${escapeHtml(node.name)}</strong>
          <button class="copy-name" type="button" title="Copy name" aria-label="Copy name">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="8" width="12" height="13" rx="2"></rect>
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
        </div>
        ${parts.join('')}
      `;
      const copyButton = info.querySelector('.copy-name');
      copyButton.addEventListener('click', async event =>{
        event.stopPropagation();
        let copied = false;
        try{
          if (!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
          await navigator.clipboard.writeText(node.name);
          copied = true
        }
        catch{
          const field = document.createElement('textarea');
          field.value = node.name;
          field.style.position = 'fixed';
          field.style.opacity = '0';
          document.body.appendChild(field);
          field.select();
          copied = document.execCommand('copy');
          field.remove()
        }
        copyButton.title = copied ? 'Copied': 'Copy failed';
        copyButton.setAttribute('aria-label', copyButton.title);
        if (copied)copyButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
        setTimeout(() =>{
          if (copyButton.isConnected){
            copyButton.title = 'Copy name';
            copyButton.setAttribute('aria-label', 'Copy name');
            copyButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>'
          }
        }, 1200)
      });
      info.querySelectorAll('.muscle-search').forEach(link => link.addEventListener('click', event =>{
        event.preventDefault();
        event.stopPropagation();
        clearTimeout(searchTimer);
        searchInputs.muscles.value = link.dataset.muscle.replace(/_/g, ' ').toLowerCase();
        applySearch()
      }));
      info.querySelectorAll('.equipment-search').forEach(link => link.addEventListener('click', event =>{
        event.preventDefault();
        event.stopPropagation();
        clearTimeout(searchTimer);
        searchInputs.equipment.value = link.dataset.equipment.toLowerCase();
        applySearch()
      }));
      info.classList.add('show');
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }
      [c]))
    }
    function setAll(node, value){
      if (node.children?.length)node.open = value;
      for (const child of node.children ||[])setAll(child, value)
    }
    const floatingTools = document.querySelector('.floating-tools'), searchToggle = document.getElementById('search-toggle');
    searchToggle.addEventListener('click', () =>{
      const open = floatingTools.classList.toggle('search-open');
      searchToggle.setAttribute('aria-expanded', String(open));
      searchToggle.setAttribute('aria-label', open ? 'Hide search fields': 'Show search fields');
      searchToggle.title = open ? 'Hide search fields': 'Search';
      if (!open)closeSuggestions()
    });
    document.getElementById('collapse').addEventListener('click', () =>{
      highlightedNodeId = null;
      categories.forEach(c => setAll(c, false));
      draw(true);
      network.focus('root',{
        scale: network.getScale(), animation: false
      });
      document.getElementById('info').classList.remove('show')
    });
    document.getElementById('fit').addEventListener('click', () => network.fit({
      animation:{
        duration: 250, easingFunction: 'easeInOutQuad'
      }
    }));
    document.getElementById('favorites-filter').addEventListener('click', () =>{
      favoritesOnly = !favoritesOnly;
      syncFavoritesFilter();
      clearTimeout(searchTimer);
      applySearch()
    });
    syncFavoritesFilter();
    document.getElementById('images-filter').addEventListener('click', () =>{
      const wasSearching = hasActiveSearch();
      imagesOnly = !imagesOnly;
      syncImagesFilter();
      clearTimeout(searchTimer);
      applySearch(wasSearching)
    });
    syncImagesFilter();
    const searchInputs ={
      name: document.getElementById('search-name'),
      equipment: document.getElementById('search-equipment'),
      muscles: document.getElementById('search-muscles')
    }, result = document.getElementById('result');
    let searchTimer = null;
    function frequentOptions(counts){
      return[... counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'en')).map(([name]) => name)
    }
    const equipmentCounts = new Map(), muscleCounts = new Map(), muscleSuggestionNames ={
      ABS: 'abs',
      OBLIQUES: 'obliques',
      LOWER_BACK: 'lower back',
      HIPS: 'hips',
      QUADS: 'quadriceps',
      CHEST: 'chest',
      SHOULDERS: 'shoulders',
      BICEPS: 'biceps',
      FOREARM: 'forearm',
      CALVES: 'calves',
      HAMSTRINGS: 'hamstrings',
      GLUTES: 'glutes',
      ADDUCTORS: 'adductors',
      ABDUCTORS: 'abductors',
      LATS: 'lats',
      TRAPS: 'traps',
      TRICEPS: 'triceps'
    };
    exercises.forEach(exercise =>{
      (exercise.equipment ||[]).forEach(item => equipmentCounts.set(item.toLowerCase(), (equipmentCounts.get(item.toLowerCase()) || 0) + 1));
      [... (exercise.primaryMuscles ||[]), ... (exercise.secondaryMuscles ||[])].forEach(group =>{
        const label = (muscleSuggestionNames[group] || group.replace(/_/g, ' ')).toLowerCase();
        muscleCounts.set(label, (muscleCounts.get(label) || 0) + 1)
      })
    });
    const suggestionOptions ={
      equipment: frequentOptions(equipmentCounts),
      muscles: frequentOptions(muscleCounts)
    }, suggestionLists ={
      equipment: document.getElementById('equipment-suggestions'),
      muscles: document.getElementById('muscle-suggestions')
    };
    function closeSuggestions(){
      Object.entries(suggestionLists).forEach(([key, list]) =>{
        list.classList.remove('show');
        searchInputs[key].setAttribute('aria-expanded', 'false')
      })
    }
    function showSuggestions(key){
      const input = searchInputs[key],
      list = suggestionLists[key],
      query = input.value.trim().toLocaleLowerCase(),
      options = suggestionOptions[key].filter(option => !query || option.includes(query)).slice(0, 8);
      list.innerHTML = options.map(option => `<button type="button" role="option" data-value="${escapeHtml(option)}">${escapeHtml(option)}</button>`).join('');
      list.classList.toggle('show', options.length > 0);
      input.setAttribute('aria-expanded', String(options.length > 0))
    }
    Object.entries(searchInputs).forEach(([key, input]) =>{
      input.addEventListener('input', () =>{
        if (suggestionLists[key])showSuggestions(key);
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applySearch, 140)
      });
      if (suggestionLists[key]){
        input.addEventListener('focus', () => showSuggestions(key));
        input.addEventListener('keydown', event =>{
          if (event.key === 'Escape')closeSuggestions()
        })
      }
    });
    Object.entries(suggestionLists).forEach(([key, list]) => list.addEventListener('click', event =>{
      const option = event.target.closest('[data-value]');
      if (!option)return;
      searchInputs[key].value = option.dataset.value;
      closeSuggestions();
      clearTimeout(searchTimer);
      applySearch()
    }));
    document.addEventListener('pointerdown', event =>{
      const field = event.target.closest('.search'), keepOpen = field?.querySelector('.suggestions');
      Object.entries(suggestionLists).forEach(([key, list]) =>{
        if (list !== keepOpen){
          list.classList.remove('show');
          searchInputs[key].setAttribute('aria-expanded', 'false')
        }
      })
    });
    function applySearch(wasSearching = hasActiveSearch()){
      const next ={
        name: searchInputs.name.value.trim().toLocaleLowerCase(),
        equipment: searchInputs.equipment.value.trim().toLocaleLowerCase(),
        muscles: searchInputs.muscles.value.trim().toLocaleLowerCase()
      };
      activeSearches = next;
      const searching = hasActiveSearch();
      searchMatchCache.clear();
      visibleChildrenCache.clear();
      pointerHoveredExerciseId = null;
      mapEl.style.cursor = 'default';
      result.classList.toggle('show', searching);
      if (!searching){
        highlightedNodeId = null;
        result.textContent = '';
        categories.forEach(c => setAll(c, false));
        draw(true);
        network.focus('root',{
          scale: network.getScale(), animation: false
        });
        document.getElementById('info').classList.remove('show');
        return
      }
      const hits =[];
      function visit(node, path =[]){
        const nextPath =[... path,
        node];
        if (matchesSearch(node))hits.push({
          node, path: nextPath
        });
        for (const child of node.children ||[])visit(child, nextPath)
      }
      visit(root);
      categories.forEach(c => setAll(c, false));
      if (!hits.length){
        highlightedNodeId = null;
        result.textContent = 'No matches found';
        draw(true);
        document.getElementById('info').classList.remove('show');
        return
      }
      for (const hit of hits){
        for (const parent of hit.path.slice(0, - 1))if (parent.children?.length)parent.open = true;
        if (hit.node.children?.length)hit.node.open = true
      }
      result.textContent = `Matches: ${hits.length}`;
      draw(true);
      if (!wasSearching)network.focus(hits[0].node.id,{
        scale: Math.max(network.getScale(), .8), animation: false
      });
      showInfo(hits[0].node)
    }
    window.addEventListener('resize', () => network.redraw());
  </script>

</body>
