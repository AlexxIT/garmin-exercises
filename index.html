  <style>
    :root{color-scheme:light;--ink:#243744;--muted:#71838c;--line:#dce6e9;--paper:#f5f8f8;--blue:#079fda}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .map-wrap{position:relative;height:100%;overflow:hidden;background-color:#f7fafb;background-image:radial-gradient(#dce5e8 1px,transparent 1px);background-size:22px 22px}
    .floating-tools{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:flex-start;gap:8px}
    .search-tools{display:flex;flex-direction:column;gap:5px}
    .search{position:relative;width:230px}.search:before{content:"⌕";position:absolute;left:10px;top:1px;color:#7b9099;font-size:21px;pointer-events:none}.search input{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--line);border-radius:9px;background:#ffffffed;color:var(--ink);font:inherit;font-size:12px;outline:none;box-shadow:0 3px 12px #1435450b}.search input:focus{border-color:#62bed6;box-shadow:0 0 0 3px #079fda16}.suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:6;display:none;max-height:220px;overflow:auto;padding:4px;border:1px solid #dce6e9;border-radius:9px;background:#fff;box-shadow:0 8px 20px #1435451a}.suggestions.show{display:block}.suggestions button{display:block;width:100%;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:#354b57;font:inherit;font-size:12px;text-align:left;cursor:pointer}.suggestions button:hover,.suggestions button:focus{outline:none;background:#eaf6f8;color:#087f9f}
    .actions{display:flex;gap:6px}.actions button{display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:10px;background:#ffffffed;color:#425563;cursor:pointer;box-shadow:0 3px 12px #1435450b}.actions button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.actions button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.actions button:hover{border-color:#8ccbdc;color:#0573aa}.actions button[aria-pressed="true"]{background:#fff3c4;border-color:#e3b228;color:#a77900}
    #map{width:100%;height:100%;outline:none}

    @media(max-width:520px){

      .foot{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:calc(100vw - 16px);font-size:10px}
    }

    function categoryHitAt(point){if(!point)return null;for(let i=activeVisibleNodeRecords.length-1;i>=0;i--){const record=activeVisibleNodeRecords[i];if(record.node.type!=='category')continue;if(Math.abs(point.x-record.x)<=record.width/2+15&&Math.abs(point.y-record.y)<=record.height/2+15)return record.node.id}return null}
    function rootHitAt(point){if(!point)return null;return Math.abs(point.x)<=rootCardWidth/2+15&&Math.abs(point.y)<=rootCardHeight/2+15?'root':null}
    network.on('click',params=>{const favoriteId=favoriteHitAt(params.pointer?.canvas);if(favoriteId){const favoriteNode=findNode(root,favoriteId),key=favoriteKey(favoriteNode);favoriteIds.has(key)?favoriteIds.delete(key):favoriteIds.add(key);saveFavorites();searchMatchCache.clear();visibleChildrenCache.clear();if(favoritesOnly)applySearch();else draw(true);return}const id=exerciseHitAt(params.pointer?.canvas)||categoryHitAt(params.pointer?.canvas)||rootHitAt(params.pointer?.canvas)||params.nodes[0];if(!id)return;const node=id==='root'?root:categories.find(c=>c.id===id)||findNode(root,id);if(!node)return;if(node.id==='root'){categories.forEach(c=>setAll(c,false));draw(true)}else if(node.children?.length){node.open=!node.open;draw(true)}showInfo(node)});
    mapEl.addEventListener('pointermove',event=>{if(event.pointerType==='touch'){mapEl.style.cursor='grab';return}const rect=mapEl.getBoundingClientRect(),dom={x:event.clientX-rect.left,y:event.clientY-rect.top},canvas=network.DOMtoCanvas(dom),exerciseId=exerciseHitAt(canvas),nodeId=exerciseId||categoryHitAt(canvas)||rootHitAt(canvas)||network.getNodeAt(dom)||null;if(exerciseId!==pointerHoveredExerciseId){pointerHoveredExerciseId=exerciseId;scheduleNetworkRedraw()}mapEl.style.cursor=nodeId?'pointer':'grab'});
    mapEl.addEventListener('pointerleave',()=>{if(pointerHoveredExerciseId){pointerHoveredExerciseId=null;scheduleNetworkRedraw()}mapEl.style.cursor='grab'});
    function findNode(node,id){for(const child of node.children||[]){if(child.id===id)return child;const found=findNode(child,id);if(found)return found}return null}
    function showInfo(node){
      highlightedNodeId=node.id;scheduleNetworkRedraw();
      const info=document.getElementById('info'),parts=[],links=[],seen=new Set();
      const addSource=(label,url)=>{if(!url||seen.has(url))return;seen.add(url);links.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(label)} ↗</a>`)};
      if(node.difficulty)parts.push(`<small>Difficulty: ${escapeHtml(node.difficulty)}</small>`);
      if(node.equipment?.length){const equipmentLinks=node.equipment.map(item=>`<a href="#search-equipment" class="equipment-search" data-equipment="${escapeHtml(item)}">${escapeHtml(item.toLowerCase())}</a>`).join(', ');parts.push(`<small>Equipment: ${equipmentLinks}</small>`)}
      if(hasMuscleTargets(node)){
        const muscleLinks=list=>(list||[]).filter(Boolean).map(m=>`<a href="#search" class="muscle-search" data-muscle="${escapeHtml(m)}">${escapeHtml(m.replace(/_/g,' ').toLowerCase())}</a>`).join(', ');
        const primaryLinks=muscleLinks(node.primaryMuscles);
        if(primaryLinks)parts.push(`<small>Primary muscles: ${primaryLinks}</small>`);
        const secondaryLinks=muscleLinks(node.secondaryMuscles);
        if(secondaryLinks)parts.push(`<small>Secondary muscles: ${secondaryLinks}</small>`);
      }
      if(node.imageSourceName)parts.push(`<small>Illustration: ${escapeHtml(node.imageSourceName)}</small>`);
      if(node.type==='exercise'){
        if(node.url)addSource('Garmin Connect',node.url);
        if(node.imageSourceUrl)addSource(node.imageCredit||'Image source',node.imageSourceUrl);
        (node.externalSources||[]).forEach(source=>addSource(source.source,source.url));
        if(links.length)parts.push(`<div class="source-links">${links.join('')}</div>`);
      }
      info.innerHTML=`<div class="info-heading"><strong>${escapeHtml(node.name)}</strong><button class="copy-name" type="button" title="Copy name" aria-label="Copy name"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg></button></div>${parts.join('')}`;
      const copyButton=info.querySelector('.copy-name');
      copyButton.addEventListener('click',async event=>{event.stopPropagation();let copied=false;try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(node.name);copied=true}catch{const field=document.createElement('textarea');field.value=node.name;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();copied=document.execCommand('copy');field.remove()}copyButton.title=copied?'Copied':'Copy failed';copyButton.setAttribute('aria-label',copyButton.title);if(copied)copyButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';setTimeout(()=>{if(copyButton.isConnected){copyButton.title='Copy name';copyButton.setAttribute('aria-label','Copy name');copyButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>'}},1200)});
      info.querySelectorAll('.muscle-search').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();clearTimeout(searchTimer);searchInputs.muscles.value=link.dataset.muscle.replace(/_/g,' ').toLowerCase();applySearch()}));
      info.querySelectorAll('.equipment-search').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();clearTimeout(searchTimer);searchInputs.equipment.value=link.dataset.equipment.toLowerCase();applySearch()}));
      info.classList.add('show');
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setAll(node,value){if(node.children?.length)node.open=value;for(const child of node.children||[])setAll(child,value)}
    document.getElementById('collapse').addEventListener('click',()=>{highlightedNodeId=null;categories.forEach(c=>setAll(c,false));draw(true);network.focus('root',{scale:network.getScale(),animation:false});document.getElementById('info').classList.remove('show')});
    document.getElementById('fit').addEventListener('click',()=>network.fit({animation:{duration:250,easingFunction:'easeInOutQuad'}}));
    document.getElementById('favorites-filter').addEventListener('click',()=>{favoritesOnly=!favoritesOnly;syncFavoritesFilter();clearTimeout(searchTimer);applySearch()});syncFavoritesFilter();
    const searchInputs={name:document.getElementById('search-name'),equipment:document.getElementById('search-equipment'),muscles:document.getElementById('search-muscles')},result=document.getElementById('result');
    let searchTimer=null;
    function frequentOptions(counts){return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'en')).map(([name])=>name)}
    const equipmentCounts=new Map(),muscleCounts=new Map(),muscleSuggestionNames={ABS:'abs',OBLIQUES:'obliques',LOWER_BACK:'lower back',HIPS:'hips',QUADS:'quadriceps',CHEST:'chest',SHOULDERS:'shoulders',BICEPS:'biceps',FOREARM:'forearm',CALVES:'calves',HAMSTRINGS:'hamstrings',GLUTES:'glutes',ADDUCTORS:'adductors',ABDUCTORS:'abductors',LATS:'lats',TRAPS:'traps',TRICEPS:'triceps'};
    exercises.forEach(exercise=>{(exercise.equipment||[]).forEach(item=>equipmentCounts.set(item.toLowerCase(),(equipmentCounts.get(item.toLowerCase())||0)+1));[...(exercise.primaryMuscles||[]),...(exercise.secondaryMuscles||[])].forEach(group=>{const label=(muscleSuggestionNames[group]||group.replace(/_/g,' ')).toLowerCase();muscleCounts.set(label,(muscleCounts.get(label)||0)+1)})});
    const suggestionOptions={equipment:frequentOptions(equipmentCounts),muscles:frequentOptions(muscleCounts)},suggestionLists={equipment:document.getElementById('equipment-suggestions'),muscles:document.getElementById('muscle-suggestions')};
    function closeSuggestions(){Object.entries(suggestionLists).forEach(([key,list])=>{list.classList.remove('show');searchInputs[key].setAttribute('aria-expanded','false')})}
    function showSuggestions(key){const input=searchInputs[key],list=suggestionLists[key],query=input.value.trim().toLocaleLowerCase(),options=suggestionOptions[key].filter(option=>!query||option.includes(query)).slice(0,8);list.innerHTML=options.map(option=>`<button type="button" role="option" data-value="${escapeHtml(option)}">${escapeHtml(option)}</button>`).join('');list.classList.toggle('show',options.length>0);input.setAttribute('aria-expanded',String(options.length>0))}
    Object.entries(searchInputs).forEach(([key,input])=>{input.addEventListener('input',()=>{if(suggestionLists[key])showSuggestions(key);clearTimeout(searchTimer);searchTimer=setTimeout(applySearch,140)});if(suggestionLists[key]){input.addEventListener('focus',()=>showSuggestions(key));input.addEventListener('keydown',event=>{if(event.key==='Escape')closeSuggestions()})}});
    Object.entries(suggestionLists).forEach(([key,list])=>list.addEventListener('click',event=>{const option=event.target.closest('[data-value]');if(!option)return;searchInputs[key].value=option.dataset.value;closeSuggestions();clearTimeout(searchTimer);applySearch()}));
    document.addEventListener('pointerdown',event=>{const field=event.target.closest('.search'),keepOpen=field?.querySelector('.suggestions');Object.entries(suggestionLists).forEach(([key,list])=>{if(list!==keepOpen){list.classList.remove('show');searchInputs[key].setAttribute('aria-expanded','false')}})});
    function applySearch(){const next={name:searchInputs.name.value.trim().toLocaleLowerCase(),equipment:searchInputs.equipment.value.trim().toLocaleLowerCase(),muscles:searchInputs.muscles.value.trim().toLocaleLowerCase()},wasSearching=hasActiveSearch();activeSearches=next;const searching=hasActiveSearch();searchMatchCache.clear();visibleChildrenCache.clear();pointerHoveredExerciseId=null;mapEl.style.cursor='default';result.classList.toggle('show',searching);if(!searching){highlightedNodeId=null;result.textContent='';categories.forEach(c=>setAll(c,false));draw(true);network.focus('root',{scale:network.getScale(),animation:false});document.getElementById('info').classList.remove('show');return}const hits=[];function visit(node,path=[]){const nextPath=[...path,node];if(matchesSearch(node))hits.push({node,path:nextPath});for(const child of node.children||[])visit(child,nextPath)}visit(root);categories.forEach(c=>setAll(c,false));if(!hits.length){highlightedNodeId=null;result.textContent='No matches found';draw(true);document.getElementById('info').classList.remove('show');return}for(const hit of hits){for(const parent of hit.path.slice(0,-1))if(parent.children?.length)parent.open=true;if(hit.node.children?.length)hit.node.open=true}result.textContent=`Matches: ${hits.length}`;draw(true);if(!wasSearching)network.focus(hits[0].node.id,{scale:Math.max(network.getScale(),.8),animation:false});showInfo(hits[0].node)}
    window.addEventListener('resize',()=>network.redraw());
  </script>
